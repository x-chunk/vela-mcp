name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A release must finish even if another tag is pushed in the meantime.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: release verification
    uses: ./.github/workflows/verify.yml

  image:
    name: publish multi-arch image to Docker Hub
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: build metadata
        id: build
        # Use the commit timestamp so rebuilding a tag keeps its build date.
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - name: require Docker Hub configuration
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_IMAGE" || { echo "Set vars.DOCKERHUB_IMAGE to the image repository" >&2; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo "Set secrets.DOCKERHUB_USERNAME" >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Set secrets.DOCKERHUB_TOKEN" >&2; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          labels: |
            org.opencontainers.image.title=Vela MCP
            org.opencontainers.image.description=Vela MCP server with stdio and OAuth-protected Streamable HTTP
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Stable tags publish X.Y.Z, X.Y, and latest; prereleases only X.Y.Z-rc.N.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: GitHub Release with executable archives
    # Publish release notes after the image is available for the same tag.
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
