# Each tool is configured independently. Missing entries take built-in defaults.
# Unknown keys and tool names are rejected at startup; restart after editing.
# Token stays in VELA_TOKEN (.env or environment), never here.
[server]
transport = "stdio" # use http for a connector; CLI -transport overrides

[http]
listen = "127.0.0.1:8081"      # nginx connects to this plain HTTP listener
issuer = "http://127.0.0.1:8081" # replace with external https://mcp.example.org
allowed_origins = []           # issuer origin always allowed; exact extra origins
max_request_bytes = 52428800   # MCP JSON body cap, separate from binary limits
max_tool_result_bytes = 128000 # content+structured output; paginate/use file URLs

[oauth]
database_path = "data/oauth.db"
encryption_key_file = "data/encryption.key" # generated once; back up with DB
access_ttl = "15m"
refresh_ttl = "720h"           # absolute grant lifetime; rotation never extends it
code_ttl = "5m"
allowed_redirect_uris = []     # optional exact admin allowlist for OAuth clients

[transfers]
enabled = true                # HTTP mode only; stdio never starts a byte listener
database_path = "data/transfers.db"
ttl = "15m"

[vela]
url = "http://127.0.0.1:8080" # VELA_URL overrides this value
timeout = "120s"             # per HTTP request AND complete tool invocation
retries = 2                  # only requests deemed retryable by the Vela client

[files]
# Optional process/container directories. They must already exist.
# Local paths in tool calls must be absolute and remain inside these roots.
upload_roots = []
download_roots = []
max_upload_bytes = 268435456   # 256 MiB, streaming local uploads
max_inline_bytes = 8388608    # 8 MiB, decoded text/base64 input
max_read_bytes = 32768        # 32 KiB preview; full files use HTTP/local download
max_download_bytes = 268435456

[tools]
server_info = true
list_directory = true
search_files = true
get_file_metadata = true
read_file = true
download_file = true
create_text_file = true
upload_file = true
replace_file = false
update_file_metadata = true
set_file_visibility = true
move_file = true
move_directory = true
trash_file = true
trash_directory = false
list_trash = true
restore_file = true
create_share_link = true
list_share_links = true
revoke_share_link = true
inspect_directory = true
list_directory_policies = true
update_directory_policy = true
reset_directory_policy = true
update_root_directory_policy = false
purge_file = false
purge_trash_entry = false
empty_trash = false
prepare_file_upload = true
prepare_file_download = true
get_file_transfer_status = true
